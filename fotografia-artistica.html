<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotografía artística — Pilar Machado</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-padding-top: 80px; }
    :root { --black: #F1EADC; --surface: #E8DEC9; --white: #221D18; --accent: #7A2436; --gold: #A0793D; --gray: #75695A; --border: rgba(34,29,24,0.14); }
    body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; font-weight: 300; }

    .pm-nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2.5rem; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; background: rgba(241,234,220,0.85); backdrop-filter: blur(10px); z-index: 100; }
    .pm-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.08em; color: var(--white); text-decoration: none; }
    .pm-logo span { color: var(--accent); }
    .pm-back { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); text-decoration: none; transition: color 0.2s; }
    .pm-back:hover { color: var(--accent); }

    .page-header { padding: 4rem 2.5rem 2rem; border-bottom: 0.5px solid var(--border); }
    .page-header-top { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 1rem; }
    .page-num { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; color: var(--accent); letter-spacing: 0.1em; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 6vw, 5rem); letter-spacing: 0.04em; line-height: 1; }
    .page-line { flex: 1; height: 0.5px; background: var(--border); margin-left: 1rem; }
    .page-desc { font-size: 0.95rem; color: var(--gray); max-width: 520px; line-height: 1.7; }

    .pm-gallery-wrap { padding: 2rem 2.5rem 6rem; overflow: visible; }
    .folder-row { display: flex; column-gap: 2.75rem; row-gap: 10rem; justify-content: center; align-items: flex-start; padding: 10rem 0 0.5rem; overflow: visible; flex-wrap: wrap; }
    .folder-item { width: 240px; cursor: pointer; position: relative; }
    /* carpeta de vidrio: fotos asomando detrás + frente translúcido */
    .gfolder { position: relative; width: 240px; height: 250px; }
    .gcard { position: absolute; bottom: 78px; width: 118px; height: 150px; object-fit: cover; border: 4px solid #FBF7F0; border-radius: 12px; box-shadow: 0 6px 18px rgba(34,29,24,0.18); transition: transform 0.5s cubic-bezier(0.34, 1.35, 0.64, 1), box-shadow 0.4s ease; z-index: 1; }
    .gcard-l { left: 4px; transform: rotate(-13deg); }
    .gcard-r { right: 4px; transform: rotate(13deg); }
    .gcard-c { left: 61px; bottom: 88px; transform: rotate(-2deg); z-index: 2; }
    .gfront { position: absolute; left: 0; bottom: 0; width: 240px; height: 170px; z-index: 3;
      clip-path: path('M18 0 H104 C114 0 118 5 122 11 L126 17 C129 22 133 24 142 24 H222 Q240 24 240 42 V152 Q240 170 222 170 H18 Q0 170 0 152 V18 Q0 0 18 0 Z');
      background: linear-gradient(165deg, rgba(122,36,54,0.30) 0%, rgba(122,36,54,0.62) 55%, rgba(84,22,37,0.86) 100%);
      -webkit-backdrop-filter: blur(11px) saturate(140%); backdrop-filter: blur(11px) saturate(140%);
      transition: transform 0.35s ease; }
    .gfront::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 35%, rgba(255,255,255,0) 60%); }
    .gfront-text { position: absolute; left: 16px; right: 16px; bottom: 14px; color: #fff; }
    .gtitle { display: block; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.3; }
    .gsub { display: block; font-size: 0.72rem; color: rgba(255,255,255,0.72); margin-top: 0.2rem; line-height: 1.35; }
    .folder-item:hover .gcard-c { transform: translateY(-175px) scale(1.6) rotate(0deg); z-index: 5; box-shadow: 0 18px 40px rgba(34,29,24,0.38); }
    .folder-item:hover .gcard-l { transform: translate(6px, 22px) rotate(-8deg); }
    .folder-item:hover .gcard-r { transform: translate(-6px, 22px) rotate(8deg); }
    .folder-item:hover .gfront { transform: translateY(3px); }

    .pm-footer { padding: 2rem 2.5rem; display: flex; justify-content: space-between; align-items: center; }
    .pm-footer-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.1em; color: var(--gray); }
    .pm-footer-copy { font-size: 0.68rem; color: rgba(34,29,24,0.4); letter-spacing: 0.05em; }
    /* cursor-camera */
    html, body { cursor: url('img/cursor/camera.svg') 16 18, auto; }
    a, button, [onclick], .folder-item, .category-panel, .masonry-item, .lightbox-prev, .lightbox-next, .lightbox-close { cursor: url('img/cursor/camera-click.svg') 16 18, pointer !important; }
  </style>
</head>
<body>

  <nav class="pm-nav">
    <a href="index.html" class="pm-logo">P<span>.</span>M</a>
    <a href="index.html#foto" class="pm-back">← Volver al portfolio</a>
  </nav>

  <div class="page-header">
    <div class="page-header-top">
      <span class="page-num">03</span>
      <h1 class="page-title">Fotografía artística</h1>
      <div class="page-line"></div>
    </div>
    <p class="page-desc">Retrato, moda y ciudad — una mirada más libre, con tiempo para buscar la luz.</p>
  </div>

  <div class="pm-gallery-wrap">
    <div class="folder-row">
      <div class="folder-item" onclick="window.location.href='retratos-urbanos.html'">
        <div class="gfolder"><img class="gcard gcard-l" src="img/artistica/artistica-8915.jpg" alt="" loading="lazy" /><img class="gcard gcard-r" src="img/artistica/artistica-8992.jpg" alt="" loading="lazy" /><img class="gcard gcard-c" src="img/artistica/artistica-9588.jpg" alt="Retratos urbanos · Montevideo" /><div class="gfront"><div class="gfront-text"><span class="gtitle">Retratos urbanos</span><span class="gsub">Montevideo</span></div></div></div>
      </div>
      <div class="folder-item" onclick="window.location.href='tiziana-1-anio.html'">
        <div class="gfolder"><img class="gcard gcard-l" src="img/tiziana/tiziana-9506.jpg" alt="" loading="lazy" /><img class="gcard gcard-r" src="img/tiziana/tiziana-9508.jpg" alt="" loading="lazy" /><img class="gcard gcard-c" src="img/tiziana/tiziana-9629.jpg" alt="Tiziana 1 año" /><div class="gfront"><div class="gfront-text"><span class="gtitle">Tiziana 1 año</span></div></div></div>
      </div>
    </div>
  </div>

  <footer class="pm-footer">
    <span class="pm-footer-name">Pilar Machado</span>
    <span class="pm-footer-copy">Fotografía & Comunicación Digital — 2025</span>
  </footer>

</body>
</html>
